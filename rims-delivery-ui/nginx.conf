# Preserve the original scheme when a TLS terminator (Caddy) is in front, and fall back to this
# server's own scheme when there is no upstream proxy (local demo).
map $http_x_forwarded_proto $rims_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the API through Docker's embedded DNS and re-resolve every 10s, so the API can be
    # recreated (new container, new IP) during an update without this proxy pointing at a dead
    # address until it is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Resolve the real client address when a trusted TLS terminator sits in front. Only peers on
    # the Docker networks are trusted; a caller reaching this server directly cannot forge its
    # address, because its own IP is not in these ranges and so $remote_addr stays the true client.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr is the real client (see real_ip above). Overwrite rather than append so a
        # caller-supplied X-Forwarded-For cannot survive as the first entry and let the API's rate
        # limiter be evaded.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $rims_forwarded_proto;
    }
    location = /health {
        set $health_upstream http://api:8000;
        proxy_pass $health_upstream/health;
    }
    location = /ready {
        set $ready_upstream http://api:8000;
        proxy_pass $ready_upstream/ready;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
