server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, not append: this nginx is the only ingress, so $remote_addr is the true
        # client. $proxy_add_x_forwarded_for would preserve a caller-supplied value as the first
        # entry, letting a client forge its identity and evade the API's rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health { proxy_pass http://api:8000/health; }
    location = /ready { proxy_pass http://api:8000/ready; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
