services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rims
      POSTGRES_USER: rims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rims -d rims"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://rims:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/rims
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the root .env file}
      JWT_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the root .env file}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in the root .env file}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in the root .env file}
      PROVIDER_USER_AGENT: "${PROVIDER_USER_AGENT:-RIMsDeliveryPricing/1.0}"
      # The api is reachable only through the bundled nginx, which overwrites X-Forwarded-For with
      # the real client address, so trusting it is safe here and lets the rate limiter distinguish
      # clients instead of collapsing every request onto the proxy's address.
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    restart: unless-stopped

  web:
    build: ./rims-delivery-ui
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
