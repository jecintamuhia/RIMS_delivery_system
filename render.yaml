# Render Blueprint for the RIMs Delivery API.
#
# Deploys the FastAPI backend as a Docker web service plus a managed PostgreSQL
# database. The Vite frontend is served separately by Vercel, which reverse-proxies
# /api/* to this service so admin session cookies stay first-party.
#
# Apply either by connecting this repo in the Render dashboard ("New > Blueprint")
# or by creating the two resources by hand. Values marked `sync: false` are never
# stored in git and are prompted for at apply time.
#
# The review-friendly plan/region below are the smallest paid options. Adjust to
# match your account before applying.
databases:
  - name: rims-postgres
    databaseName: rims
    user: rims
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: rims-api
    runtime: docker
    region: frankfurt
    plan: starter
    # Both paths are relative to the repo root (Render's rule), not to each other.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DOCS_ENABLED
        value: "false"
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: TRUST_FORWARDED_FOR
        value: "true"
      - key: CSRF_PROTECTION
        value: "true"
      - key: COUNTRY_CODE
        value: ke
      - key: GEOCODING_PROVIDER
        value: osm
      - key: ROUTING_PROVIDER
        value: osm
      - key: PROVIDER_USER_AGENT
        value: "RIMsDeliveryPricing/1.0 (contact: operations@rimssuppliesandhardware.co.ke)"
      - key: CORS_ORIGINS
        value: "https://rimssuppliesandhardware.co.ke,https://www.rimssuppliesandhardware.co.ke"
      - key: DATABASE_URL
        fromDatabase:
          name: rims-postgres
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
